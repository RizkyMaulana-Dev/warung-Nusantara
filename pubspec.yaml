name: umkm_pesanan
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder may be overridden by flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while buildCode used by build
# number used in AndroidManifest.xml.
# In iOS, build-name is used as CFBundleShortVersionString while build number
# used as CFBundleVersion.
# Read more about Android versioning at
# https://developer.android.com/studio/publish/versioning
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build number is used as the build suffix.
version: 1.0.5+2006

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below.
# Read more about pub.dev dependencies at https://dart.dev/tools/pub/dependencies
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Font Plus Jakarta Sans sesuai DESIGN.md
  google_fonts: ^6.2.1

  # HTTP client untuk API
  http: ^1.2.2

  # Cek status jaringan (online/offline)
  connectivity_plus: ^6.0.5

  # Buka tautan eksternal (WhatsApp, email)
  url_launcher: ^6.2.5

  # Simpan sesi login dan preferensi lokal
  shared_preferences: ^2.3.2
  # Wajib >=2.5.2: versi 2.5.0/2.5.1 crash di release Android karena R8
  # me-rename kotlin.coroutines.Continuation sehingga panggilan JNI gagal.
  shared_preferences_android: ^2.5.3

  # Lokasi dan jarak cabang (multi-cabang)
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generate ikon launcher dari assets/splash/app_icon_source.png
  flutter_launcher_icons: ^0.14.4

# Konfigurasi ikon launcher. Sumber: frame TERAKHIR GIF splash
# (logo Warung Nusantara) — bukan GIF, sudah PNG.
flutter_launcher_icons:
  image_path: "assets/splash/app_icon_source.png"
  android: true
  ios: false
  remove_alpha_ios: false
  web:
    generate: true
    image_path: "assets/splash/app_icon_source.png"
    background_color: "#165630"
    theme_color: "#165630"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubpec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Font Plus Jakarta Sans dibundel agar tidak perlu unduh saat aplikasi
  # pertama kali dibuka (lebih cepat dan tetap rapi saat offline).
  assets:
    - assets/google_fonts/
    - assets/splash/

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/google_fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
